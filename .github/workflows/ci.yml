name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    # Windows: the booth app prints through the Windows spooler and uses PowerShell, so tests run where it runs.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: All tests (virtual printer, no camera or network needed)
        run: node --test tests/*.test.cjs
